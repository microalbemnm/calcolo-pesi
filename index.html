<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prepreg">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1015" media="(prefers-color-scheme: dark)">
<title>Calcolatore Prepreg</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #12141a; --muted: #6b7280;
    --line: #e5e7eb; --accent: #4f46e5; --accent-soft: #eef0ff; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1015; --card: #171a21; --text: #f2f3f5; --muted: #8b93a1;
      --line: #262b35; --accent: #8b87ff; --accent-soft: #1f2140;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 36px 40px 48px; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
  header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .seg { display: flex; gap: 4px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 9px 22px; border-radius: 9px;
                font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s, color .15s; font-family: inherit; }
  .seg button small { display: block; font-weight: 400; font-size: 11px; opacity: .85; margin-top: 1px; }
  .seg button:hover:not(.active) { background: var(--bg); color: var(--text); }
  .seg button.active { background: var(--accent); color: #fff; }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg.small { background: var(--bg); border-radius: 10px; margin-bottom: 12px; }
  .seg.small button { padding: 7px 10px; font-size: 13px; border-radius: 7px; }
  .seg.small button.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  /* Layout */
  .layout { display: grid; grid-template-columns: 420px 1fr; gap: 24px; align-items: start; }
  .col-results { position: sticky; top: 24px; }
  .panel { display: none; }
  .panel.active { display: contents; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-bottom: 20px; }
  .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 16px; font-weight: 600; }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .input { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
           padding: 0 14px; transition: border-color .15s, box-shadow .15s; }
  .input:hover { border-color: var(--muted); }
  .input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .input input, .input select { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text);
           font-size: 16px; font-weight: 600; padding: 11px 0; font-family: inherit; -webkit-appearance: none; appearance: none; }
  .input select { cursor: pointer; }
  .input.sel::after { content: "▾"; color: var(--muted); font-size: 12px; pointer-events: none; }
  .input .u { color: var(--muted); font-size: 13px; margin-left: 10px; white-space: nowrap; }
  .hidden { display: none; }

  .err { color: #dc2626; font-size: 13px; margin-top: 12px; }
  .err:empty { display: none; }

  /* Risultati */
  .results-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .results-head h2 { margin: 0; }
  .copy { border: 1px solid var(--line); background: transparent; color: var(--text); font-size: 12px; font-weight: 600;
          padding: 6px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; transition: all .15s; }
  .copy:hover { border-color: var(--accent); color: var(--accent); }
  .results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .res { background: var(--bg); border-radius: 12px; padding: 18px; min-width: 0; }
  .res.main { background: var(--accent-soft); }
  .res span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .res b { font-size: 28px; letter-spacing: -0.02em; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .res b i { font-style: normal; font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .res.main b { color: var(--accent); }

  .detail { margin-top: 18px; }
  .detail div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 2px; font-size: 14px; border-top: 1px solid var(--line); }
  .detail div span { color: var(--muted); }
  .detail div b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

  .note { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 16px 2px 0; }
  .hint { font-size: 12px; color: var(--muted); text-align: right; margin-top: 24px; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; font-size: 11px; background: var(--card); }

  /* Barra riepilogo: solo smartphone */
  .summary { display: none; }

  /* ===== Tablet / smartphone ===== */
  @media (max-width: 860px) {
    .wrap { padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
    header { flex-direction: column; align-items: stretch; gap: 14px; margin-bottom: 16px; }
    header h1 { font-size: 22px; }
    header p { font-size: 13px; }
    .seg button { padding: 10px 8px; font-size: 15px; }
    .layout { grid-template-columns: 1fr; gap: 0; }
    .col-results { position: static; }
    .card { padding: 18px; margin-bottom: 14px; }
    .input input, .input select { font-size: 17px; padding: 13px 0; }
    .results { grid-template-columns: 1fr; gap: 8px; }
    .res { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px; }
    .res span { margin: 0; font-size: 14px; }
    .res b { font-size: 22px; }
    .hint { display: none; }

    .summary {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      position: sticky; top: 0; z-index: 10; margin: 0 -16px 14px; padding: 10px 16px;
      padding-top: calc(10px + env(safe-area-inset-top));
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .summary div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; min-width: 0; }
    .summary span { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .summary b { display: block; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .summary b.main { color: var(--accent); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Calcolatore Prepreg</h1>
      <p>Conversione tra metri, m² e kg a partire dal peso areale.</p>
    </div>
    <div class="seg" role="tablist">
      <button id="tab-gg" class="active" role="tab" onclick="show('gg')">GG<small>peso fibra secca</small></button>
      <button id="tab-smc" role="tab" onclick="show('smc')">SMC<small>peso prepreg finito</small></button>
    </div>
  </header>

  <div class="summary" id="summary">
    <div><span>Lunghezza</span><b id="s_len">-</b></div>
    <div><span>Superficie</span><b id="s_area">-</b></div>
    <div><span>Massa</span><b id="s_kg">-</b></div>
  </div>

  <div class="layout">
    <!-- ================= GG ================= -->
    <div id="panel-gg" class="panel active">
      <div class="col-inputs">
        <div class="card">
          <h2>Dati materiale</h2>
          <div class="field"><label for="gg_fw">Peso fibra secca</label>
            <div class="input"><input id="gg_fw" type="text" inputmode="decimal" autocomplete="off" value="200"><span class="u">g/m²</span></div></div>

          <div class="field">
            <label>Resina</label>
            <div class="seg small">
              <button id="rm-rc" class="active" onclick="setResinMode('rc')">RC % (m/m)</button>
              <button id="rm-gsm" onclick="setResinMode('gsm')">Peso g/m²</button>
            </div>
            <div class="input" id="box_rc"><input id="gg_rc" type="text" inputmode="decimal" autocomplete="off" value="40" aria-label="Contenuto resina RC"><span class="u">%</span></div>
            <div class="input hidden" id="box_rw"><input id="gg_rw" type="text" inputmode="decimal" autocomplete="off" value="" aria-label="Peso resina"><span class="u">g/m²</span></div>
          </div>

          <div class="field"><label for="gg_w">Larghezza produttiva</label>
            <div class="input"><input id="gg_w" type="text" inputmode="decimal" autocomplete="off" value="120"><span class="u">cm</span></div></div>
        </div>
        <div class="card">
          <h2>Quantità nota</h2>
          <div class="field"><label for="gg_mode">Cosa conosci</label>
            <div class="input sel"><select id="gg_mode">
              <option value="len">Lunghezza</option>
              <option value="area">Superficie</option>
              <option value="kg">Massa prepreg</option>
            </select></div></div>
          <div class="field"><label for="gg_val">Valore</label>
            <div class="input"><input id="gg_val" type="text" inputmode="decimal" autocomplete="off" value="100"><span class="u" id="gg_unit">m</span></div></div>
          <div id="gg_err" class="err"></div>
        </div>
      </div>

      <div class="col-results">
        <div class="card" id="gg_card">
          <div class="results-head"><h2>Risultato</h2><button class="copy" onclick="copyRes('gg', this)">Copia</button></div>
          <div class="results" id="gg_res"></div>
          <div class="detail" id="gg_det"></div>
        </div>
        <p class="note" id="gg_note"></p>
      </div>
    </div>

    <!-- ================= SMC ================= -->
    <div id="panel-smc" class="panel">
      <div class="col-inputs">
        <div class="card">
          <h2>Dati materiale</h2>
          <div class="field"><label for="smc_pw">Peso prepreg finito</label>
            <div class="input"><input id="smc_pw" type="text" inputmode="decimal" autocomplete="off" value="3000"><span class="u">g/m²</span></div></div>
          <div class="field"><label for="smc_w">Altezza prodotto</label>
            <div class="input"><input id="smc_w" type="text" inputmode="decimal" autocomplete="off" value="100"><span class="u">cm</span></div></div>
        </div>
        <div class="card">
          <h2>Quantità nota</h2>
          <div class="field"><label for="smc_mode">Cosa conosci</label>
            <div class="input sel"><select id="smc_mode">
              <option value="len">Lunghezza</option>
              <option value="area">Superficie</option>
              <option value="kg">Massa prepreg</option>
            </select></div></div>
          <div class="field"><label for="smc_val">Valore</label>
            <div class="input"><input id="smc_val" type="text" inputmode="decimal" autocomplete="off" value="10"><span class="u" id="smc_unit">m</span></div></div>
          <div id="smc_err" class="err"></div>
        </div>
      </div>

      <div class="col-results">
        <div class="card" id="smc_card">
          <div class="results-head"><h2>Risultato</h2><button class="copy" onclick="copyRes('smc', this)">Copia</button></div>
          <div class="results" id="smc_res"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="hint"><kbd>Tab</kbd> per passare al campo successivo &middot; <kbd>Alt</kbd>+<kbd>1</kbd> GG &middot; <kbd>Alt</kbd>+<kbd>2</kbd> SMC</div>
</div>

<script>
function $(id){ return document.getElementById(id); }
var isTouch = window.matchMedia('(pointer: coarse)').matches;
var current = 'gg';
var resinMode = 'rc';
var lastText = {gg:'', smc:''};
var lastRes = {gg:null, smc:null};
var units = {len:'m', area:'m²', kg:'kg'};

// Accetta sia la virgola che il punto come separatore decimale
function num(id){
  var s = String($(id).value).trim().replace(/\s/g, '').replace(',', '.');
  return s === '' ? NaN : Number(s);
}
function fmt(x, d){ return isFinite(x) ? x.toLocaleString('it-IT', {maximumFractionDigits: d, minimumFractionDigits: 0}) : '-'; }
function fmtIn(x){ return isFinite(x) ? String(Math.round(x * 10) / 10).replace('.', ',') : ''; }

function show(t){
  current = t;
  ['gg','smc'].forEach(function(k){
    $('panel-'+k).classList.toggle('active', k===t);
    $('tab-'+k).classList.toggle('active', k===t);
  });
  updateSummary();
  if (!isTouch) { var f = $(t === 'gg' ? 'gg_fw' : 'smc_pw'); f.focus(); f.select(); }
}

function setResinMode(m){
  if (m === resinMode) return;
  // Conversione del valore corrente per mantenere la coerenza tra i due campi
  var fw = num('gg_fw');
  if (m === 'gsm') {
    var rc = num('gg_rc');
    if (fw > 0 && rc >= 0 && rc < 100) $('gg_rw').value = fmtIn(fw * rc / (100 - rc));
  } else {
    var rw = num('gg_rw');
    if (fw > 0 && rw >= 0) $('gg_rc').value = fmtIn(100 * rw / (fw + rw));
  }
  resinMode = m;
  $('rm-rc').classList.toggle('active', m === 'rc');
  $('rm-gsm').classList.toggle('active', m === 'gsm');
  $('box_rc').classList.toggle('hidden', m !== 'rc');
  $('box_rw').classList.toggle('hidden', m !== 'gsm');
  if (!isTouch) { var f = $(m === 'rc' ? 'gg_rc' : 'gg_rw'); f.focus(); f.select(); }
  calcGG();
}

document.addEventListener('keydown', function(e){
  if (e.altKey && e.key === '1') { e.preventDefault(); show('gg'); }
  if (e.altKey && e.key === '2') { e.preventDefault(); show('smc'); }
});
document.querySelectorAll('input').forEach(function(i){
  i.addEventListener('focus', function(){ setTimeout(function(){ try { i.setSelectionRange(0, i.value.length); } catch(e){} }, 0); });
});

function solve(pw, w, mode, val){
  var area, len, kg, kgPerM2 = pw / 1000;
  if (mode === 'len')  { len = val; area = len * w; kg = area * kgPerM2; }
  if (mode === 'area') { area = val; len = area / w; kg = area * kgPerM2; }
  if (mode === 'kg')   { kg = val; area = kg / kgPerM2; len = area / w; }
  return {len:len, area:area, kg:kg};
}
function resBox(label, value, unit, main){
  return '<div class="res'+(main?' main':'')+'"><span>'+label+'</span><b>'+value+'<i>'+unit+'</i></b></div>';
}
function resultsHTML(r, mode){
  return resBox('Lunghezza', fmt(r.len,2), 'm', mode!=='len') +
         resBox('Superficie', fmt(r.area,3), 'm²', false) +
         resBox('Massa prepreg', fmt(r.kg,3), 'kg', mode!=='kg');
}
function detRow(a,b){ return '<div><span>'+a+'</span><b>'+b+'</b></div>'; }

function updateSummary(){
  var r = lastRes[current];
  var mode = $(current + '_mode').value;
  $('s_len').textContent  = r ? fmt(r.len,1) + ' m' : '-';
  $('s_area').textContent = r ? fmt(r.area,2) + ' m²' : '-';
  $('s_kg').textContent   = r ? fmt(r.kg,2) + ' kg' : '-';
  $('s_len').className  = (r && mode !== 'len') ? 'main' : '';
  $('s_area').className = '';
  $('s_kg').className   = (r && mode !== 'kg') ? 'main' : '';
}

function calcGG(){
  var mode = $('gg_mode').value;
  $('gg_unit').textContent = units[mode];
  var fw = num('gg_fw'), wcm = num('gg_w'), val = num('gg_val');
  var rc = num('gg_rc'), rw = num('gg_rw');
  var err = '';
  if (!(fw > 0)) err = 'Inserisci un peso fibra secca maggiore di 0.';
  else if (resinMode === 'rc' && !(rc >= 0 && rc < 100)) err = 'RC deve essere tra 0 e 99,9 %.';
  else if (resinMode === 'gsm' && !(rw >= 0)) err = 'Inserisci il peso della resina in g/m².';
  else if (!(wcm > 0)) err = 'Inserisci una larghezza maggiore di 0.';
  else if (!(val >= 0)) err = 'Inserisci il valore della quantità nota.';
  $('gg_err').textContent = err;
  $('gg_card').style.visibility = err ? 'hidden' : 'visible';
  if (err) { lastRes.gg = null; updateSummary(); return; }

  var pw, rcCalc;
  if (resinMode === 'rc') { pw = fw / (1 - rc/100); rcCalc = rc; }
  else { pw = fw + rw; rcCalc = 100 * rw / pw; }
  var resinGsm = pw - fw;

  var r = solve(pw, wcm/100, mode, val);
  var fiberKg = r.area * fw / 1000;
  var resinKg = r.kg - fiberKg;
  lastRes.gg = r;

  $('gg_res').innerHTML = resultsHTML(r, mode);
  $('gg_det').innerHTML =
    detRow('Peso areale prepreg', fmt(pw,1)+' g/m²') +
    detRow('Peso areale resina', fmt(resinGsm,1)+' g/m²') +
    detRow('Contenuto resina RC', fmt(rcCalc,1)+' %') +
    detRow('Fibra secca totale', fmt(fiberKg,3)+' kg') +
    detRow('Resina totale', fmt(resinKg,3)+' kg');
  $('gg_note').textContent = resinMode === 'rc'
    ? 'Peso prepreg = peso fibra / (1 − RC/100). RC è la massa di resina sulla massa totale del prepreg.'
    : 'Peso prepreg = peso fibra + peso resina. RC calcolato come resina / prepreg totale.';

  lastText.gg = 'Lunghezza: '+fmt(r.len,2)+' m\nSuperficie: '+fmt(r.area,3)+' m²\nMassa prepreg: '+fmt(r.kg,3)+' kg\n' +
    'Peso prepreg: '+fmt(pw,1)+' g/m²\nPeso resina: '+fmt(resinGsm,1)+' g/m²\nRC: '+fmt(rcCalc,1)+' %\n' +
    'Fibra secca: '+fmt(fiberKg,3)+' kg\nResina: '+fmt(resinKg,3)+' kg';
  updateSummary();
}

function calcSMC(){
  var mode = $('smc_mode').value;
  $('smc_unit').textContent = units[mode];
  var pw = num('smc_pw'), wcm = num('smc_w'), val = num('smc_val');
  var err = '';
  if (!(pw > 0)) err = 'Inserisci un peso del prepreg maggiore di 0.';
  else if (!(wcm > 0)) err = 'Inserisci un\'altezza maggiore di 0.';
  else if (!(val >= 0)) err = 'Inserisci il valore della quantità nota.';
  $('smc_err').textContent = err;
  $('smc_card').style.visibility = err ? 'hidden' : 'visible';
  if (err) { lastRes.smc = null; updateSummary(); return; }
  var r = solve(pw, wcm/100, mode, val);
  lastRes.smc = r;
  $('smc_res').innerHTML = resultsHTML(r, mode);
  lastText.smc = 'Lunghezza: '+fmt(r.len,2)+' m\nSuperficie: '+fmt(r.area,3)+' m²\nMassa prepreg: '+fmt(r.kg,3)+' kg';
  updateSummary();
}

function copyRes(k, btn){
  var done = function(){ var t = btn.textContent; btn.textContent = 'Copiato'; setTimeout(function(){ btn.textContent = t; }, 1200); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(lastText[k]).then(done, fallback); }
  else fallback();
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = lastText[k]; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, 99999); document.execCommand('copy'); document.body.removeChild(ta); done();
  }
}

['gg_fw','gg_rc','gg_rw','gg_w','gg_val','gg_mode'].forEach(function(id){ $(id).addEventListener('input', calcGG); });
['smc_pw','smc_w','smc_val','smc_mode'].forEach(function(id){ $(id).addEventListener('input', calcSMC); });
calcGG(); calcSMC();
</script>
</body>
</html>
